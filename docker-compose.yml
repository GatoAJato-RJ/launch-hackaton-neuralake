services:
  app:
    build: .
    container_name: agent-craigslist-app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src

  postgres:
    image: postgres:17
    container_name: agent-craigslist-postgres
    environment:
      POSTGRES_DB: agent_craigslist
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_craigslist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
